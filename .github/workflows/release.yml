# AI Defender release engines: build the engine on each supported platform's own runner, run the
# Rust test suite and the end-to-end global installation test there with that exact binary, and
# upload it with its checksum.
#
# Nothing here signs or publishes. The release owner downloads the `engine-*` artifacts, signs
# their manifests locally with the offline release key, packs the single `ai-defender` package
# and publishes it (docs/RELEASING.md). No key or npm credential is stored in this repository.
name: release-engines

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: engine ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { platform: darwin-x64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: darwin-arm64, os: macos-14, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # rust-toolchain.toml pins the compiler; the target is added to that pinned toolchain.
      - name: Rust target
        run: rustup target add ${{ matrix.target }}
      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Rust tests
        run: cargo test --workspace --all-features --locked
      - name: Release engine
        shell: bash
        run: |
          set -euo pipefail
          # Build paths are remapped so the binary carries no runner paths.
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo=cargo --remap-path-prefix=$HOME/.rustup=rustup"
          if [ "$RUNNER_OS" = "Linux" ]; then export RUSTFLAGS="$RUSTFLAGS -C target-feature=+crt-static"; fi
          cargo build --release --locked -p agentguard-engine-cli --target ${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/agentguard-engine
          file "$bin"
          if [ "$RUNNER_OS" = "Linux" ]; then file "$bin" | grep -q "statically linked\|static-pie linked"; fi
          if strings "$bin" | grep -E "/home/runner|/Users/runner"; then echo "runner paths in binary"; exit 1; fi
          mkdir -p out && cp "$bin" out/agentguard-engine
          (cd out && shasum -a 256 agentguard-engine > agentguard-engine.sha256 && cat agentguard-engine.sha256)
      - name: End-to-end global installation with this engine
        working-directory: cli
        run: |
          npm ci
          npm run e2e:install -- --engine ../out/agentguard-engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: out/
          if-no-files-found: error
