[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # unsafe-libyaml (via serde_yaml) is archived. It parses project and policy YAML, which is
    # size-limited before parsing. Replacing the YAML stack is tracked in docs/KNOWN_LIMITATIONS.md.
    { id = "RUSTSEC-2024-0449", reason = "serde_yaml backend archived; replacement tracked in KNOWN_LIMITATIONS" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path and are never published.
allow-wildcard-paths = true
deny = [
    # No raw libc calls outside vetted wrappers.
    { crate = "libc", wrappers = ["nix", "rustix", "getrandom", "time", "tempfile", "errno", "mio", "socket2", "sha2", "cpufeatures", "uuid", "libredox", "io-lifetimes", "linux-raw-sys", "wait-timeout"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
